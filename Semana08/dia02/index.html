<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maratón G31 - 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  body { font-family: sans-serif; }
  .font-mono { font-family: monospace; }
</style>
</head>
<body class="bg-white text-neutral-900 min-h-screen">

  <main class="max-w-2xl mx-auto px-6 py-16">

    <!-- Encabezado -->
    <header class="mb-10 flex items-end justify-between gap-6">
      <div>
        <p class="font-mono text-xs text-bib tracking-widest uppercase mb-1">Maratón G31 - 2026</p>
        <h1 class="text-3xl font-semibold tracking-tight">Corredores</h1>
      </div>
      <div class="text-right shrink-0">
        <p id="contador" class="text-3xl font-semibold leading-none">0</p>
        <p class="font-mono text-[11px] text-neutral-400 uppercase tracking-widest">inscritos</p>
      </div>
    </header>

    <div class="flex gap-4">
			<!-- Formulario -->
			<form id="form" class="mb-12 border border-neutral-200 rounded-xl p-6" novalidate>
				<input type="hidden" id="corredorId">

				<p class="font-mono text-[11px] uppercase tracking-widest text-neutral-400 mb-4">inscripción</p>

				<div class="flex flex-col gap-4 mb-4">
					<label class="block text-xs text-neutral-500 mb-1">
						Nombre completo
						<input
							id="nombre" type="text" placeholder="Ana Torres"
							class="w-full border-b border-neutral-200 bg-transparent py-2 text-sm outline-none focus:border-neutral-900 transition-colors"
						>
					</label>

					<label class="block text-xs text-neutral-500 mb-1">
						Edad
						<input
							id="edad" type="number" placeholder="28"
							class="w-full border-b border-neutral-200 bg-transparent py-2 text-sm outline-none focus:border-neutral-900 transition-colors"
						>
					</label>

					<label class="block text-xs text-neutral-500 mb-1">
						Categoría
						<select
							id="categoria"
							class="w-full border-b border-neutral-200 bg-transparent py-2 text-sm outline-none focus:border-neutral-900 transition-colors"
						>
							<option value="">Elegir</option>
							<option value="5K">5K</option>
							<option value="10K">10K</option>
							<option value="21K">21K</option>
							<option value="42K">42K</option>
						</select>
					</label>

						<label class="block text-xs text-neutral-500 mb-1">
							Dorsal
							<input
								id="dorsal" type="number" placeholder="101"
								class="w-full border-b border-neutral-200 bg-transparent py-2 text-sm font-mono outline-none focus:border-neutral-900 transition-colors"
							>
						</label>
				</div>

				<div class="flex flex-col items-center gap-4">
					<button
						type="submit" id="submitBtn"
						class="w-full bg-neutral-900 text-white text-sm font-medium px-6 py-2.5 rounded-full hover:bg-bib transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
					>
						Inscribir
					</button>
					<button
						type="button" id="cancelBtn"
						class="text-sm text-neutral-400 hover:text-neutral-900 transition-colors hidden"
					>
						Cancelar edición
					</button>
				</div>
			</form>

			<!-- Lista -->
			<section class="w-full">
				<div class="flex items-center justify-between mb-4">
					<h2 class="font-mono text-[11px] uppercase tracking-widest text-neutral-400">Lista de salida</h2>
					<div class="h-px flex-1 bg-neutral-200 mx-4"></div>
				</div>

				<ul id="lista" class="space-y-3 mb-4">
					<li class="flex items-center gap-4 bg-white border border-neutral-200 rounded-xl px-4 py-3 hover:border-neutral-300 transition-colors">
						<div class="shrink-0 w-14 h-14 rounded-lg border border-neutral-200 flex items-center justify-center bg-neutral-50">
              <span class="font-mono text-base font-medium">101</span>
            </div>

            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium truncate">Nombre completo</p>
              <div class="flex items-center gap-2 mt-1">
                <span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700">5K</span>
                <span class="text-xs text-neutral-400">18 años</span>
              </div>
            </div>

            <div class="flex items-center gap-3 shrink-0">
              <button data-action="editar" data-id="${corredor.id}" class="text-xs text-neutral-400 hover:text-neutral-900 transition-colors">
                Editar
              </button>
              <button data-action="eliminar" data-id="${corredor.id}" class="text-xs text-neutral-400 hover:text-red-500 transition-colors">
                Eliminar
              </button>
            </div>
					</li>
				</ul>

				<div id="vacio" class="hidden--off text-center py-16 border border-dashed border-neutral-200 rounded-xl">
					<p class="text-lg font-semibold text-neutral-400 mb-1">Sin corredores aún</p>
					<p class="text-sm text-neutral-400">La línea de salida está vacía. Inscribe al primero.</p>
				</div>

				<p id="loading" class="font-mono text-xs text-neutral-400 uppercase tracking-widest py-10 text-center">
					Cargando corredores...
				</p>
			</section>
		</div>

  </main>

	<footer>
		<p class="text-center text-xs text-neutral-400">
			<a href="https://github.com/victorvzn/bootcamp-frontend-python-g31-jv" target="_blank" class="hover:underline">
				Bootcamp Frontend Python G31 JV - Victor Villazón
			</a>
		</p>
	</footer>
	<script src="main.js"></script>
</body>
</html>
